[project]
name = "audiomark-server"
version = "0.1.0"
description = "Transcription backend for audiomark (faster-whisper)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "faster-whisper>=1.2.1",
  # faster-whisper 1.2 passes `metadata_errors`, which PyAV 16 removed.
  "av<16",
  "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
